services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teste_onfly_app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - teste_onfly

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: teste_onfly_queue
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - teste_onfly

  mailpit:
    image: axllent/mailpit:latest
    container_name: teste_onfly_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - teste_onfly

  db:
    image: mysql:9.7
    container_name: teste_onfly_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: teste_onfly
      MYSQL_USER: teste_onfly
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teste_onfly

networks:
  teste_onfly:
    driver: bridge

volumes:
  db_data:
